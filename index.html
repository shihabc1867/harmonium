<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#16120f">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Harmonium</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="start">
  <div>
    <h1>Harmonium</h1>
    <button id="start-btn">Tap to start</button>
    <p>Opens in full screen, landscape.</p>
  </div>
</div>

<div id="rotate">
  <div>
    <div class="big">&#8635;</div>
    <p>Please rotate your phone<br>to landscape mode</p>
  </div>
</div>

<div id="app">
  <header>
    <div class="brand">Harmonium</div>
    <nav>
      <button class="tab on"
        data-view="play">Play</button>
      <button class="tab"
        data-view="learn">Learn</button>
      <button class="tab" disabled
        title="Coming in Phase 3">Songs</button>
    </nav>
    <div class="tools">
      <button id="oct-dn">Oct &minus;</button>
      <span id="oct-val">0</span>
      <button id="oct-up">Oct +</button>
      <button id="btn-theme">Light</button>
      <button id="btn-set">Settings</button>
      <button id="btn-install" hidden>Install</button>
    </div>
  </header>
  <main>
    <section id="lesson" hidden>
      <div class="l-left">
        <div class="l-top">
          <button id="l-list">Stages</button>
          <span id="l-title"></span>
          <span id="l-step"></span>
        </div>
        <p id="l-text"></p>
      </div>
      <div class="l-right">
        <div id="l-notes"></div>
        <div id="l-msg"></div>
        <div class="l-btns">
          <button id="l-hear">Hear it</button>
          <button id="l-show" hidden>Show notes</button>
          <button id="l-back">Back</button>
          <button id="l-next" class="on">Next</button>
        </div>
      </div>
    </section>
    <div id="keys"></div>
  </main>
</div>

<div id="sheet" class="overlay" hidden>
  <div class="card">
    <h2>Settings</h2>
    <label>Scale (pitch of Sa)
      <select id="set-scale"></select>
    </label>
    <label>Volume
      <input id="set-vol" type="range"
        min="0" max="1" step="0.05">
    </label>
    <label>Reeds
      <select id="set-reed">
        <option value="1">Single reed</option>
        <option value="2">Double reed (fuller)</option>
      </select>
    </label>
    <label>Key labels
      <select id="set-labels">
        <option value="both">Sargam + Western</option>
        <option value="sargam">Sargam only</option>
        <option value="western">Western only</option>
      </select>
    </label>
    <label class="row">
      <input id="set-drone" type="checkbox">
      Drone (Sa + Pa)
    </label>
    <p class="hint-text">
      Install: open the Chrome menu (three dots)
      and tap "Install app".
    </p>
    <button id="set-close">Close</button>
  </div>
</div>

<div id="stages" class="overlay" hidden>
  <div class="card">
    <h2>Tutorial stages</h2>
    <div id="stage-list"></div>
    <button id="stages-reset">Reset progress</button>
    <button id="stages-close">Close</button>
  </div>
</div>

<script src="notation.js"></script>
<script src="app.js"></script>
<script src="lessons.js"></script>
<script src="learn.js"></script>
</body>
</html>
